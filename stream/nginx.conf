# SERVER A (origin) - a.gaafu.tv
# Needs in /etc/nginx/nginx.conf: worker_processes auto; events { worker_connections 8192; }
# Add to http block: proxy_cache_path not needed here (we serve files directly)

map $uri $hls_cache {
  ~\.m3u8$ "public, max-age=1";
  default  "public, max-age=60, immutable";
}

server {
  listen 80;
  server_name a.gaafu.tv;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name a.gaafu.tv;

  # SSL managed by certbot
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  access_log off;
  server_tokens off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;

  location /hls/ {
    root /var/www;  # /hls/ -> /var/www/hls/
    types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
    add_header Cache-Control $hls_cache always;
    add_header Access-Control-Allow-Origin "https://www.gaafu.tv" always;
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /healthz {
    return 200 "ok\n";
    access_log off;
  }
}
