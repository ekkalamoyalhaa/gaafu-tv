# SERVER B (and C, D...). No encoder. It copies the stream from server A and serves viewers.
# B asks A for each file once, however many viewers ask B.

proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls:10m max_size=2g inactive=2m use_temp_path=off;

server {
  listen 80;
  listen 443 ssl http2;
  server_name b.gaafu.tv;
  # ssl_certificate / ssl_certificate_key ...

  sendfile on; tcp_nopush on; tcp_nodelay on;
  access_log off;

  location /hls/ {
    proxy_pass https://a.gaafu.tv;          # server A
    proxy_http_version 1.1;
    proxy_set_header Host a.gaafu.tv;
    proxy_ssl_server_name on;
    proxy_set_header Connection "";          # keep the link to A open between requests

    proxy_cache hls;
    proxy_cache_lock on;                     # 500 viewers asking for one new file become one request to A
    proxy_cache_lock_timeout 5s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;

    # Playlists change every 2 s, files never change. Use our own cache rules and our own CORS header,
    # and drop A's, so each header appears once (two copies of a CORS header make browsers reject the reply).
    proxy_ignore_headers Cache-Control Expires;
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Expose-Headers;
    location ~ \.m3u8$ {
      proxy_pass https://a.gaafu.tv;
      proxy_set_header Host a.gaafu.tv;
      proxy_ssl_server_name on;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_cache hls;
      proxy_cache_lock on;
      proxy_cache_valid 200 1s;
      proxy_ignore_headers Cache-Control Expires;
      proxy_hide_header Cache-Control;
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
      proxy_cache_background_update on;
      add_header Cache-Control "public, max-age=1" always;
      add_header Access-Control-Allow-Origin "https://www.gaafu.tv" always;
    }
    location ~ \.ts$ {
      proxy_pass https://a.gaafu.tv;
      proxy_set_header Host a.gaafu.tv;
      proxy_ssl_server_name on;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_cache hls;
      proxy_cache_lock on;
      proxy_cache_valid 200 60s;
      proxy_ignore_headers Cache-Control Expires;
      proxy_hide_header Cache-Control;
      proxy_hide_header Access-Control-Allow-Origin;
      add_header Cache-Control "public, max-age=60, immutable" always;
      add_header Access-Control-Allow-Origin "https://www.gaafu.tv" always;
    }
  }
  location = /healthz { return 200 "ok\n"; }
}
